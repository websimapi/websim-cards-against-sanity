<html>
<head>
  <title>Cards Against Sanity</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="lobby" class="lobby-container">
      <h1>Cards Against Sanity</h1>
      <div id="player-list">
        <h2>Players</h2>
        <ul id="players"></ul>
      </div>
      <div id="lobby-controls">
        <div id="host-settings" style="display: none;">
          <h2>Host Settings</h2>
          <label for="card-context">Card Generation Context:</label>
          <input type="text" id="card-context" placeholder="e.g., pop culture, technology">
          <button id="start-game-button">Start Game</button>
        </div>
        <p id="waiting-for-host" style="display: none;">Waiting for host to start the game...</p>
      </div>
    </div>

    <div id="game" class="game-container" style="display: none;">
      <div id="black-card-area">
        <div id="black-card" class="card black-card"></div>
      </div>
      <div id="submissions-area">
        <h2>Submissions</h2>
        <div id="submitted-cards"></div>
      </div>
      <div id="hand-area">
        <h2>Your Hand</h2>
        <div id="white-cards" class="hand"></div>
      </div>
      <div id="czar-controls" style="display: none;">
        <p>You are the Card Czar. Choose the winning card.</p>
      </div>
      <div id="winner-display" style="display: none;">
        <p><span id="winner-name"></span> won the round!</p>
        <p>Winning Card: <span id="winning-card-text"></span></p>
        <button id="next-round-button">Next Round</button>
      </div>
      <div id="scoreboard">
          <h2>Scoreboard</h2>
          <ul id="scores"></ul>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "config": "./config.js"
      }
    }
  </script>
  <script type="module" src="script.js"></script>

</body>
</html>
